name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Valor de relleno solo para que Prisma genere el cliente; las pruebas no usan base real.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx jest --ci
      - name: Auditoría de dependencias (informativa)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Lint (informativo, hay 3 errores preexistentes)
        run: npm run lint
        continue-on-error: true
